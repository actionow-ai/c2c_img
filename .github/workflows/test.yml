name: tests
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests (no Pillow; sips only on macOS)
        run: python tests/test_offline.py
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Offline tests (Pillow backend)
        run: python tests/test_offline.py
      - name: Engine tests (daemon + exec against fake codex)
        run: python tests/test_engines.py
